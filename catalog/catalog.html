<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Catalogue des cartes</title>
    <link rel="stylesheet" href="style_catalog.css">
    <script src="script_catalog.js" defer></script>
</head>
<body>

<header class="header">
    <div class="catalog-title">CATALOGUE</div>
    <button class="back-button" id="backBtn">Retour</button>
</header>

<main>
    <section class="grid" id="catalogGrid"></section>
</main>

<div class="modal-window" id="popUpWindow">
    <div class="modal-content">
        <img id="popUpImg" alt="Character">
        <div class="modal-text">
            <h2 id="popUpName"></h2>
            <p id="popUpDesc"></p>
            <button id="closeBtn">Fermer</button>
        </div>
    </div>
</div>

</body>
</html>
